    </div>
  </div>

let DATA = [];
async function decodeData(){
  const bin = Uint8Array.from(atob(DATA_B64), c=>c.charCodeAt(0));
  if (typeof DecompressionStream === "function") {
    const ds = new DecompressionStream("gzip");
    const stream = new Blob([bin]).stream().pipeThrough(ds);
    const buf = await new Response(stream).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }
  throw new Error("DecompressionStream not supported in this browser; please use a current Chromium/Firefox/Safari.");
}
function formatAssessmentTypes(items){
  if (!Array.isArray(items) || !items.length) return "";
  return `<ul class="list-unstyled mb-0 assess-list">${items.map(entry => `<li>${entry.type||""}</li>`).join("")}</ul>`;
}

function formatAssessmentWeights(items){
  if (!Array.isArray(items) || !items.length) return "";
  return `<ul class="list-unstyled mb-0 assess-list text-muted">${items.map(entry => `<li>${entry.weight||""}</li>`).join("")}</ul>`;
}

function formatAssessmentCategories(items){
  if (!Array.isArray(items) || !items.length) return "";
  return `<ul class="list-unstyled mb-0 assess-list">${items.map(entry => `<li>${entry.category||""}</li>`).join("")}</ul>`;
}

function formatAssessmentPassFail(items){
  if (!Array.isArray(items) || !items.length) return "";
  return `<ul class="list-unstyled mb-0 assess-list text-muted">${items.map(entry => `<li>${entry.pass_fail||""}</li>`).join("")}</ul>`;
}

function formatWeightSummary(rec){
  const items = rec["Assessments"] || [];
  const weights = items.map(it => (it.weight||"").toString().replace("%", ""));
  const missing = weights.some(w => w.trim() === "");
  const numeric = weights
    .map(w => parseFloat(w))
    .filter(n => Number.isFinite(n));
  if (missing) return `<div class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle">Missing weight</div>`;
  if (numeric.length) return `<div class="small text-muted">Total: ${numeric.reduce((a,b)=>a+b,0).toFixed(0)}%</div>`;
  return "";
}

function formatVersion(rec){
  const bits = [];
  if (rec["Module Version"]) bits.push(`v${rec["Module Version"]}`);
  if (rec["Effective From"]) bits.push(rec["Effective From"]);
  return bits.length ? `<div class="small text-muted">${bits.join(" · ")}</div>` : "";
}



function unique(arr){return Array.from(new Set(arr));}
function nonEmpty(a){return a&&a.trim()!=="";}

function initSchools(){
  const schools=unique(DATA.map(r=>r["School Responsible"]).filter(nonEmpty)).sort((a,b)=>a.localeCompare(b));
  const sel=document.getElementById("schoolSelect");
  schools.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;sel.appendChild(o);});
}

function fillProgrammesForSchool(school){
  const progs=DATA.filter(r=>(r["School Responsible"]||"").trim()===school.trim())
    .map(r=>(r["Programme Title"]||"").trim()+" | "+(r["TU Programme Code"]||"").trim())
    .filter(k=>k!==" | ");
  const sel=document.getElementById("programmeSelect");
  sel.innerHTML='<option value="">-- Select programme --</option>';
  const uniq=unique(progs).sort((a,b)=>a.localeCompare(b));
  uniq.forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=k;sel.appendChild(o);});
  sel.disabled=uniq.length===0;
}

function fillYearsForProgramme(progKey){
  const [title,code]=progKey.split(" | ");
  const years=DATA.filter(r=>(r["Programme Title"]||"").trim()===title&&(r["TU Programme Code"]||"").trim()===code)
    .map(r=>(r["Year"]||"").toString().trim()).filter(nonEmpty);
  const sel=document.getElementById("yearSelect");
  sel.innerHTML='<option value="">-- Select year --</option>';
  const uniq=unique(years).sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0));
  uniq.forEach(y=>{const o=document.createElement("option");o.value=y;o.textContent=y;sel.appendChild(o);});
  sel.disabled=uniq.length===0;
}

function categorizeSemester(s,year){
  const v=(s||"").toLowerCase();
  const y=(year||"").toString().trim();
  // Treat Term/Semester 3 in Year 2 masters as Semester 1
  if(y==="2"&&(v.includes("3")||v.includes("term 3"))) return"1";
  const has1=v.includes("1"),has2=v.includes("2");
  if(has1&&has2)return"1&2";
  if(has1&&!has2)return"1";
  if(!has1&&has2)return"2";
  return"Other";
}

function render(progKey,year){
  const [title,code]=progKey.split(" | ");
  const items=DATA.filter(r=>(r["Programme Title"]||"").trim()===title.trim()&&(r["TU Programme Code"]||"").trim()===code.trim()&&(r["Year"]||"").toString().trim()===year);
  const meta=items[0]||{};
  document.getElementById("metaMode").textContent=meta["Programme Delivery Mode"]||"";
  document.getElementById("metaType").textContent=meta["Programme Type"]||"";
  document.getElementById("metaNFQ").textContent=meta["NFQ Level"]||"";
  document.getElementById("metaCampus").textContent=meta["Campus"]||"";
  const s1=items.filter(r=>categorizeSemester(r["Semester"],year)==="1");
  const s12=items.filter(r=>categorizeSemester(r["Semester"],year)==="1&2");
  const s2=items.filter(r=>categorizeSemester(r["Semester"],year)==="2");
  const sOther=items.filter(r=>categorizeSemester(r["Semester"],year)==="Other");
  const sum=a=>a.reduce((x,r)=>x+(parseFloat(r["Credits"])||0),0);
  document.getElementById("sumS1").textContent=sum(s1);
  document.getElementById("sumS12").textContent=sum(s12);
  document.getElementById("sumS2").textContent=sum(s2);
  const showSummary=items.length>0;
  document.getElementById("summaryRow").style.display=showSummary?"":"none";
  document.getElementById("pageTitle").textContent=`Programme Structure — ${title} (${code}) — Year ${year}`;
  const table=(label,arr)=>!arr.length?"":`<div class='card'><div class='card-header bg-light fw-semibold'>${label}</div><div class='card-body p-0'><div class='table-responsive'><table class='table table-sm mb-0'><thead class='table-light'><tr><th style='width:120px;'>Code</th><th style='width:320px;'>Title</th><th style='width:80px;' class='text-center'>Credits</th><th style='width:200px;'>Assessment</th><th style='width:120px;' class='text-center'>Weight</th><th style='width:160px;'>Category</th><th style='width:100px;' class='text-center'>Pass/Fail</th><th style='width:140px;'>Delivery Type</th></tr></thead><tbody>${arr.sort((a,b)=>(a["Code"]||"").localeCompare(b["Code"]||"")).map(r=>`<tr><td><span class='pill'>${r["Code"]||""}</span></td><td>${r["Title"]||""}${formatVersion(r)}</td><td class='text-center'>${r["Credits"]||""}</td><td>${formatAssessmentTypes(r["Assessments"]||[])}</td><td class='text-center'>${formatAssessmentWeights(r["Assessments"]||[]) }${formatWeightSummary(r)}</td><td>${formatAssessmentCategories(r["Assessments"]||[])}</td><td class='text-center'>${formatAssessmentPassFail(r["Assessments"]||[])}</td><td>${r["Delivery Type"]||""}</td></tr>`).join("")}</tbody></table></div></div></div>`;
  document.getElementById("contentArea").innerHTML=items.length?[table("Semester 1",s1),table("Semester 1 & 2",s12),table("Semester 2",s2),table("Other",sOther)].join("\n"):'<div class="alert alert-warning">No modules found.</div>';
}

document.addEventListener("DOMContentLoaded", async ()=>{
  try {
    DATA = await decodeData();
  } catch(err) {
    document.getElementById("contentArea").innerHTML = `<div class="alert alert-danger">Unable to load data: ${err}</div>`;
    console.error(err);
    return;
  }

  initSchools();
  const schoolSel=document.getElementById("schoolSelect"),progSel=document.getElementById("programmeSelect"),yearSel=document.getElementById("yearSelect");
  schoolSel.addEventListener("change",()=>{const s=schoolSel.value;progSel.disabled=true;yearSel.disabled=true;progSel.innerHTML='<option value="">-- Select programme --</option>';yearSel.innerHTML='<option value="">-- Select year --</option>';document.getElementById("contentArea").innerHTML='<div class="alert alert-info">Select a programme, then a year.</div>';document.getElementById("summaryRow").style.display="none";if(s){fillProgrammesForSchool(s);progSel.disabled=false;}});
  progSel.addEventListener("change",()=>{const p=progSel.value;yearSel.disabled=true;yearSel.innerHTML='<option value="">-- Select year --</option>';document.getElementById("contentArea").innerHTML='<div class="alert alert-info">Select a year.</div>';document.getElementById("summaryRow").style.display="none";if(p){fillYearsForProgramme(p);yearSel.disabled=false;}});
  yearSel.addEventListener("change",()=>{const y=yearSel.value,p=progSel.value;if(y&&p)render(p,y);});
});
</script>
