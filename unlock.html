function w2u8(w){const n=w.sigBytes,ws=w.words,u=new Uint8Array(n);let i=0,j=0;while(i<n){const x=ws[j++];u[i++]=(x>>>24)&255;if(i===n)break;u[i++]=(x>>>16)&255;if(i===n)break;u[i++]=(x>>>8)&255;if(i===n)break;u[i++]=x&255;}return u;}
document.getElementById('go').onclick=()=>{const pw=document.getElementById('pw').value||'';document.getElementById('err').textContent='';try{const b=CryptoJS.AES.decrypt(CIPHERTEXT_B64,pw);if(!b.sigBytes||b.sigBytes<=0){document.getElementById('err').textContent='Incorrect password.';return;}const gz=w2u8(b);if(!(gz[0]===31&&gz[1]===139)){document.getElementById('err').textContent='Incorrect password.';return;}const html=new TextDecoder('utf-8').decode(pako.ungzip(gz));document.open();document.write(html);document.close();}catch(e){document.getElementById('err').textContent='Incorrect password or corrupted data.';}};</script>
