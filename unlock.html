    const w=words[j++];
    u8[i++]=(w>>>24)&255; if(i===len)break;
    u8[i++]=(w>>>16)&255; if(i===len)break;
    u8[i++]=(w>>> 8)&255; if(i===len)break;
    u8[i++]= w      &255;
  }
  return u8;
}
function setErr(msg){ document.getElementById('err').textContent = msg || ""; }
function setDiag(msg){ document.getElementById('diag').textContent = msg || ""; }

document.getElementById('go').onclick = () => {
  const pw = document.getElementById('pw').value || '';
  setErr(""); setDiag("");
  try{
    // IMPORTANT: decrypt with the STRING (preserves OpenSSL salt)
    const bytes  = CryptoJS.AES.decrypt(CIPHERTEXT_B64, pw); // WordArray of gzipped bytes
    if (!bytes.sigBytes || bytes.sigBytes <= 0) { setErr("Incorrect password."); return; }
    const gzU8 = wordArrayToUint8Array(bytes);
    const okMagic = gzU8.length>=2 && gzU8[0]===0x1f && gzU8[1]===0x8b;
    if (!okMagic){ setErr("Incorrect password."); setDiag("Note: decrypted bytes do not look like GZIP."); return; }
    const plain = new TextDecoder('utf-8').decode(pako.ungzip(gzU8));
    document.open(); document.write(plain); document.close();
  }catch(e){
    console.error(e);
    setErr("Incorrect password or corrupted data.");
  }
};
document.getElementById('clear').onclick = () => { document.getElementById('pw').value = ""; setErr(""); setDiag(""); document.getElementById('pw').focus(); };
document.getElementById('pw').addEventListener('keydown', ev => { if (ev.key === 'Enter') document.getElementById('go').click(); });
</script>
