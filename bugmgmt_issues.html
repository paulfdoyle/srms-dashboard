<html lang="en">
<head>

</head>
<body>
  <div class="container-fluid px-0">
    <div class="hero d-flex justify-content-between flex-wrap gap-3 align-items-start">
      <div>
        <h1 class="h4 mb-1">BugMgmt Issues</h1>
        <div class="text-muted small">Repo-local tracker (offline) · PII-free only · Deterministic sort by status → project → severity → ID</div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span class="badge bg-secondary-subtle text-secondary-emphasis summary-badge" id="totalCount"></span>
        <a class="btn btn-outline-secondary btn-sm" href="index.html">Back to index</a>
      </div>
    </div>

    <div class="card card-flat mb-3">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-sm-6 col-lg-2">
            <label class="form-label small mb-1" for="project">Project</label>
            <select id="project" class="form-select form-select-sm"></select>
          </div>
          <div class="col-sm-6 col-lg-2">
            <label class="form-label small mb-1" for="status">Status</label>
            <select id="status" class="form-select form-select-sm"></select>
          </div>
          <div class="col-sm-6 col-lg-2">
            <label class="form-label small mb-1" for="severity">Severity</label>
            <select id="severity" class="form-select form-select-sm"></select>
          </div>
          <div class="col-sm-6 col-lg-2">
            <label class="form-label small mb-1" for="phase">Phase</label>
            <select id="phase" class="form-select form-select-sm"></select>
          </div>
          <div class="col-sm-6 col-lg-2">
            <label class="form-label small mb-1" for="stage">Stage</label>
            <select id="stage" class="form-select form-select-sm"></select>
          </div>
          <div class="col-sm-6 col-lg-2">
            <label class="form-label small mb-1" for="search">Search</label>
            <input id="search" class="form-control form-control-sm" placeholder="Search text..." />
          </div>
          <div class="col-sm-6 col-lg-2 d-flex align-items-end justify-content-end">
            <button id="resetFilters" class="btn btn-outline-secondary btn-sm w-100">Reset filters</button>
          </div>
        </div>
        <div class="filter-hint mt-2">Source: issues/issues.jsonl · Regenerate via <code>python scripts/issues.py build-report</code></div>
      </div>
    </div>

    <div class="row g-2 mb-3" id="summaryRow"></div>

    <div class="card card-flat">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-sm mb-0 align-middle">
            <thead>
              <tr>

                <th style="width: 110px;">Status</th>
                <th style="width: 110px;">Severity</th>
                <th style="width: 110px;">Project</th>
                <th style="width: 90px;">Phase</th>
                <th style="width: 110px;">Stage</th>
                <th style="width: 220px;">Area</th>
                <th style="min-width: 420px;">Details</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

"action": "update", "notes": "Applied same missing-year behaviour to Stage2 exams export/viewer: no Year=0 rows; blank hints derive Akari years only; exams meta counts now track skipped_missing_year"}, {"ts": "2025-12-16T22:26:26Z", "actor": "dev", "action": "update", "notes": "Stage2 exams export now includes Students (GLR) column (unique learner_id per Programme+Year from general_learner_record term 202510) and renders it in viewer_stage2_exams.html"}], "close_note": "Stage2 exams export now includes Students (GLR) column (unique learner_id per Programme+Year from general_learner_record term 202510) and renders it in viewer_stage2_exams.html"}];
    const severityWeight = { critical: 0, major: 1, minor: 2 };

    let ISSUES = [];

    const els = {
      project: document.getElementById("project"),
      phase: document.getElementById("phase"),
      stage: document.getElementById("stage"),
      status: document.getElementById("status"),
      severity: document.getElementById("severity"),
      search: document.getElementById("search"),
      tableBody: document.getElementById("table-body"),
      summaryRow: document.getElementById("summaryRow"),
      totalCount: document.getElementById("totalCount"),
    };

    function statusScore(item) {
      const key = norm(item.status).toLowerCase().replace(/\s+/g, "_");
      const map = { open: 0, in_progress: 1, closed: 2 };
      return (key in map) ? map[key] : 99;
    }

    function severityScore(item) {
      const map = { critical: 0, major: 1, minor: 2 };
      const key = norm(item.severity).toLowerCase();
      return (key in map) ? map[key] : 99;
    }

    function closureNote(issue) {
      if (normLower(issue.status) !== "closed") return "";
      if (issue.close_note) return esc(issue.close_note);
      if (Array.isArray(issue.events)) {
        const lastWithNote = [...issue.events].reverse().find(evt => evt && evt.notes);
        if (lastWithNote && lastWithNote.notes) return esc(lastWithNote.notes);
      }
      return "";
    }

    function sortIssues(list) {
      return [...list].sort((a, b) => {
        const aStatus = statusScore(a);
        const bStatus = statusScore(b);
        if (aStatus !== bStatus) return aStatus - bStatus;

        const aProj = norm(a.project);
        const bProj = norm(b.project);
        if (aProj !== bProj) return aProj.localeCompare(bProj);

        const aSev = severityScore(a);
        const bSev = severityScore(b);
        if (aSev !== bSev) return aSev - bSev;

        return norm(a.id).localeCompare(norm(b.id));
      });
    }

    const norm = (val) => (val === null || val === undefined) ? "" : String(val).trim();
    const normLower = (val) => norm(val).toLowerCase();
    function toStatusKey(status) {
      return norm(status).toLowerCase().replace(/\s+/g, "_") || "open";
    }

    function uniqValues(key) {
      const vals = new Set();
      ISSUES.forEach(i => {
        const v = norm(i[key]);
        if (v) vals.add(v);
      });
      return Array.from(vals).sort();
    }

    function setOptions(select, values) {
      const opts = ['<option value="">All</option>'].concat(values.map(v => `<option value="${v}">${v}</option>`));
      select.innerHTML = opts.join("");
      select.value = "";
    }

    function esc(text) {
      return (text === null || text === undefined) ? "" : String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function badgeForStatus(status) {
      const key = toStatusKey(status);
      return `<span class="badge badge-pill status-${key}">${esc(status || "open")}</span>`;
    }

    function badgeForSeverity(sev) {
      const key = (sev || "").toLowerCase();
      const cls = key === "critical" ? "severity-critical" : key === "major" ? "severity-major" : "severity-minor";
      return `<span class="badge badge-pill ${cls} text-uppercase">${esc(sev || "-")}</span>`;
    }

    function filterIssues() {
      const search = normLower(els.search.value);
      return ISSUES.filter(i => {
        if (els.project.value && normLower(i.project) !== normLower(els.project.value)) return false;
        if (els.phase.value && normLower(i.phase) !== normLower(els.phase.value)) return false;
        if (els.stage.value && normLower(i.stage) !== normLower(els.stage.value)) return false;
        if (els.status.value && normLower(i.status) !== normLower(els.status.value)) return false;
        if (els.severity.value && normLower(i.severity) !== normLower(els.severity.value)) return false;
        if (search) {
          const blob = JSON.stringify(i).toLowerCase();
          if (!blob.includes(search)) return false;
        }
        return true;
      });
    }

    function renderSummary(list) {
      const total = ISSUES.length;
      const open = list.filter(i => (i.status || "").toLowerCase() === "open").length;
      const inProgress = list.filter(i => (i.status || "").toLowerCase() === "in_progress").length;
      const closed = list.filter(i => (i.status || "").toLowerCase() === "closed").length;
      els.totalCount.textContent = `${list.length} shown / ${total} total`;
      els.summaryRow.innerHTML = `
        <div class="col-sm-4 col-lg-2">
          <div class="card summary-card h-100">
            <div class="card-body py-2">
              <div class="text-muted small">Open</div>
              <div class="h6 mb-0">${open}</div>
            </div>
          </div>
        </div>
        <div class="col-sm-4 col-lg-2">
          <div class="card summary-card h-100">
            <div class="card-body py-2">
              <div class="text-muted small">In Progress</div>
              <div class="h6 mb-0">${inProgress}</div>
            </div>
          </div>
        </div>
        <div class="col-sm-4 col-lg-2">
          <div class="card summary-card h-100">
            <div class="card-body py-2">
              <div class="text-muted small">Closed</div>
              <div class="h6 mb-0">${closed}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderTable(list) {
      els.tableBody.innerHTML = list.map(i => {
        return `
          <tr>
            <td class="fw-semibold">${esc(i.id)}</td>
            <td>${badgeForStatus(i.status)}</td>
            <td>${badgeForSeverity(i.severity)}</td>
            <td>${esc(i.project)}</td>
            <td>${esc(i.phase)}</td>
            <td>${esc(i.stage)}</td>
            <td>
              <div class="fw-semibold">${esc(i.area)}</div>
              <div class="small text-muted">${esc(i.symptom)}</div>
            </td>
            <td>
              <div><strong>Root cause:</strong> ${esc(i.root_cause)}</div>
              <div><strong>Proposed fix:</strong> ${esc(i.proposed_fix)}</div>
              <div><strong>QA repro:</strong> ${esc(i.qa_repro)}</div>
              ${closureNote(i) ? `<div><strong>Closure note:</strong> ${closureNote(i)}</div>` : ""}
              <div class="small text-muted mt-1">Opened: ${esc(i.opened_at)}${i.date_closed ? " · Closed: " + esc(i.date_closed) : ""}</div>
            </td>
          </tr>
        `;
      }).join("");
    }

    function render() {
      const list = filterIssues();
      renderSummary(list);
      renderTable(list);
    }

    async function loadIssues() {
      if (!JSON_PATH) {
        ISSUES = sortIssues(FALLBACK_ISSUES);
        return;
      }
      try {
        const res = await fetch(JSON_PATH);
        if (!res.ok) throw new Error(`Fetch failed: ${res.status}`);
        const parsed = await res.json();
        if (!Array.isArray(parsed)) throw new Error("Unexpected payload");
        ISSUES = sortIssues(parsed);
      } catch (err) {
        console.warn("Using inline fallback issues due to fetch error:", err);
        ISSUES = sortIssues(FALLBACK_ISSUES);
      }
    }

    async function init() {
      await loadIssues();
      setOptions(els.project, uniqValues("project"));
      setOptions(els.phase, uniqValues("phase"));
      setOptions(els.stage, uniqValues("stage"));
      setOptions(els.status, uniqValues("status"));
      setOptions(els.severity, uniqValues("severity"));
      [els.project, els.phase, els.stage, els.status, els.severity].forEach(el => {
        el.addEventListener("change", render);
        el.addEventListener("input", render);
      });
      els.search.addEventListener("input", render);
      const resetBtn = document.getElementById("resetFilters");
      if (resetBtn) {
        resetBtn.addEventListener("click", (evt) => {
          evt.preventDefault();
          els.project.value = "";
          els.phase.value = "";
          els.stage.value = "";
          els.status.value = "";
          els.severity.value = "";
          els.search.value = "";
          render();
        });
      }
      render();
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
